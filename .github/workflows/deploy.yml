
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: ubuntu-latest
    steps:

     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Show file structure
       run: |
	 echo '=== Repository structure ==='
	 ls -la
	 echo '=== Web directory ==='
	 ls -la web/

     - name: Check web directory exists
       run: |
         if [ ! -d 'web' ]; then
           echo 'ERROR: web/ directory not found'
           exit 1
         fi
         echo 'OK: web/ directory found'

     - name: Check index.html exists and is not empty
       run: |
         if [ ! -f 'web/index.html' ]; then
          echo 'ERROR: web/index.html not found'
          exit 1
         fi
         if [ ! -s 'web/index.html' ]; then
          echo 'ERROR: web/index.html is empty'
          exit 1
         fi
         echo 'OK: web/index.html found and is not empty'

     - name: Check style.css exists and is not empty
       run: |
         if [ ! -f 'web/style.css' ]; then
           echo 'ERROR: web/style.css not found'
           exit 1
         fi
         if [ ! -s 'web/style.css' ]; then
           echo 'ERROR: web/style.css is empty'
           exit 1
         fi
         echo 'OK: web/style.css found and is not empty'

     - name: Validation summary
       run: |
         echo '================================================'
         echo 'All validation checks passed. Safe to deploy.'
         echo '================================================'

       # ============================================================
# JOB 2: Deploy after validation passes
# ============================================================
deploy:
  name: Deploy to Nginx
  runs-on: ubuntu-latest
  needs: validate
  if: github.ref == 'refs/heads/main'

  steps:

    - name: Checkout repository
      uses: actions/checkout@v4

    # --------------------------------------------------------
    # Install and start Nginx on the GitHub runner
    # --------------------------------------------------------
    - name: Install Nginx
      run: |
        sudo apt-get update
        sudo apt-get install -y nginx

    - name: Start Nginx
      run: |
        sudo systemctl start nginx
        sudo systemctl enable nginx

    # --------------------------------------------------------
    # Copy web files to Nginx web root
    # --------------------------------------------------------
    - name: Copy web files to Nginx
      run: |
        echo "Copying files to Nginx..."

        sudo mkdir -p /var/www/html
        sudo cp -r web/* /var/www/html/

    # --------------------------------------------------------
    # Set permissions
    # --------------------------------------------------------
    - name: Set web file permissions
      run: |
        sudo chown -R www-data:www-data /var/www/html
        sudo chmod -R 755 /var/www/html

    # --------------------------------------------------------
    # Test Nginx configuration
    # --------------------------------------------------------
    - name: Test Nginx configuration
      run: |
        sudo nginx -t

    # --------------------------------------------------------
    # Reload Nginx after deployment
    # --------------------------------------------------------
    - name: Reload Nginx
      run: |
        sudo systemctl reload nginx

    # --------------------------------------------------------
    # Verify Nginx is still running
    # --------------------------------------------------------
    - name: Verify Nginx is still running
      run: |
        sudo systemctl status nginx --no-pager

    # --------------------------------------------------------
    # Verify website responds correctly
    # --------------------------------------------------------
    - name: Verify website response
      run: |
        echo "Checking deployed website..."

        curl -f http://localhost

        echo
        echo "Website responded successfully."

    # --------------------------------------------------------
    # Write deployment log entry
    # --------------------------------------------------------
    - name: Write deployment log entry
      run: |
        echo "[$(date)] Deployed commit ${{ github.sha }}" \
          | sudo tee -a /var/log/interswitch_deployments.log

    # --------------------------------------------------------
    # Deployment complete
    # --------------------------------------------------------
    - name: Deployment complete
      run: |
        echo "=========================================="
        echo "Deployment complete!"
        echo "Commit: ${{ github.sha }}"
        echo "Nginx: running"
        echo "Website: responding successfully"
        echo "=========================================="
       
