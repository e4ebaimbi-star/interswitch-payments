---
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: self-hosted
    steps:

     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Show file structure
       run: |
         echo === Repository structure ===
         Get-ChildItem -Recurse
         echo === Done ===

     - name: Check web directory exists
       run: |
         if (Test-Path -Path "web" -PathType Container) {
           echo "web directory exists" 
         } else { 
           echo "web/ directory NOT found"
           exit 1
         }  

     - name: Check index.html exists and is not empty
       run: |
         if (( Test-Path "web/index.html") -and ((Get-Item "web/index.html").Length -gt 0)) {
            echo "index.html ok"
         }  else { exit 1}

     - name: Check style.css exists and is not empty
       run: |
         if ((Test-Path "web/style.css") -and ((Get-Item "web/style.css").Length -gt 0)) {
            echo "style.css ok"
         }  else { exit 1 }

     - name: Validation summary
       run: |
         echo '================================================'
         echo 'All validation checks passed. Safe to deploy.'
         echo '================================================'


# ================================================
# JOB 2: Deploy to Ubuntu after validation passes
# ================================================
  deploy:
    name: Deploy to Ubuntu
    runs-on: self-hosted
    needs: validate # Only runs if validate passed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        cat > ~/.ssh/deploy_key << 'EOF'
        ${{ secrets.SSH_PRIVATE_KEY }}
        EOF
        chmod 600 ~/.ssh/deploy_key
        ssh-keyscan -H ${{ secrets.UBUNTU_HOST }} >> ~/.ssh/known_hosts
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Copy web files to Ubuntu
      run: |
        echo 'Copying files to Ubuntu...'
        scp -i ~/.ssh/deploy_key -r web/* \
          ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }}:/tmp/interswitch_web/

    - name: Install files to Nginx web root
      run: |
        ssh -i ~/.ssh/deploy_key \
          ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }} \
          'sudo mkdir -p /usr/share/nginx/html && \
           sudo cp /tmp/interswitch_web/* /usr/share/nginx/html/ && \
           sudo chown -R nginx:nginx /usr/share/nginx/html/ && \
           sudo chmod -R 755 /usr/share/nginx/html/'

    - name: Verify Nginx is still running
      run: |
        ssh -i ~/.ssh/deploy_key \
          ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }} \
          'sudo systemctl status nginx --no-pager'

    - name: Write deployment log entry
      run: |
        ssh -i ~/.ssh/deploy_key \
          ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }} \
          "echo '[$(date)] Deployed ${{ github.sha }}' \ | sudo tee -a /var/log/interswitch_deployments.log"

    - name: Deployment complete
      run: |
        echo '================================================'
        echo 'Deployment complete!'
        echo "Live at: http://${{ secrets.UBUNTU_HOST }}"
        echo '================================================'
