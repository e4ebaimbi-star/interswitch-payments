---
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: self-hosted
    steps:

     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Show file structure
       run: |
         echo === Repository structure ===
         Get-ChildItem -Recurse
         echo === Done ===

     - name: Check web directory exists
       run: |
         if (Test-Path -Path "web" -PathType Container) {
           echo "web directory exists" 
         } else { 
           echo "web/ directory NOT found"
           exit 1
         }  

     - name: Check index.html exists and is not empty
       run: |
         if (( Test-Path "web/index.html") -and ((Get-Item "web/index.html").Length -gt 0)) {
            echo "index.html ok"
         }  else { exit 1}

     - name: Check style.css exists and is not empty
       run: |
         if ((Test-Path "web/style.css") -and ((Get-Item "web/style.css").Length -gt 0)) {
            echo "style.css ok"
         }  else { exit 1 }

     - name: Validation summary
       run: |
         echo '================================================'
         echo 'All validation checks passed. Safe to deploy.'
         echo '================================================'


# ================================================
# JOB 2: Deploy via SSH after validation passes
# ================================================
  deploy:
    name: Deploy Via SSH
    runs-on: self-hosted
    needs: validate # Only runs if validate passed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up SSH key
      shell: cmd
      run: |
        if not exist "%USERPROFILE%\.ssh" mkdir "%USERPROFILE%\.ssh"
        echo %DEPLOY_KEY% > "%USERPROFILE%\.ssh\deploy_key"
        icacls "%USERPROFILE%\.ssh\deploy_key" /inheritance:r /grant: r "%USERNAME%:R"
        ssh-keyscan -H %UBUNTU_HOST% >> "%USERPROFILE%\.ssh\known_hosts"
      env:
        DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        UBUNTU_HOST: ${{ secrets.UBUNTU_HOST}}

    - name: Copy web files to Ubuntu
      shell: cmd
      run: |
        echo Copying files to Ubuntu...
        scp -i "%USERPROFILE%\.ssh\deploy_key" -r web\* %UBUNTU_USER%@%UBUNTU_HOST%:/tmp/interswitch_web/
      env:
        UBUNTU_USER: ${{ secrets.UBUNTU_USER }}
        UBUNTU_HOST: ${{ secrets.UBUNTU_HOST }}

    - name: Install files to Nginx web root
      shell: cmd
      run: |
        ssh -i "%USERPROFILE.ssh\deploy_key" -o StrictHostKeyChecking=no %UBUNTU_USER%@UBUNTU_HOST% "sudo mkdir -p /usr/share/nginx/html && sudo cp /tmp/interswitch_web/* /usr/share/nginx/html && sudo chown -R www-data:www-data /usr/share/nginx/html/ && sudo chmod -R 755 /usr/share/nginx/html/ && sudo systemctl reload nginx"
      env:   
        UBUNTU_USER: ${{ secrets.UBUNTU_USER }}
        UBUNTU_HOST: ${{ secrets.UBUNTU_HOST }} 

    - name: Verify Nginx is still running
      shell: cmd
      run: |
        ssh -i "%USERPROFILE%\.ssh\deploy_key" -o StrictHostKeyChecking=no %UBUNTU_USER%@%UBUNTU_HOST% "sudo systemctl is-active nginx"
      env:
        UBUNTU_USER: ${{ secrets.UBUNTU_USER }}
        UBUNTU_HOST: ${{ secrets.UBUNTU_HOST }} 

    - name: Write deployment log entry
      shell: cmd
      run: |
        ssh -i "%USERPROFILE%\.ssh/deploy_key" -o StrictHostKeyChecking=no %UBUNTU_USER%@UBUNTU_HOST% "echo [$(date)] Deployed commit ${{ github.sha }} by ${{ github.actor }} >> /var/log/interswitch-deploy.log"
      env:    
          UBUNTU_USER: ${{ secrets.UBUNTU_USER }}
          UBUNTU_HOST: ${{ secrets.UBUNTU_HOST }}
          

    - name: Deployment complete
      run: |
        echo ================================================
        echo Deployment complete!
        echo Successfully deployed to http://%UBUNTU_HOST% 
        echo ================================================
      env:
        UBUNTU_HOST: $ {{ secrets.UBUNTU_HOST }}  
