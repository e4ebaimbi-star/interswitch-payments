
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show file structure
        run: |
          echo '=== Repository structure ==='
          ls -la
          echo '=== Web directory ==='
          ls -la web/

      - name: Check web directory exists
        run: |
          if [ ! -d 'web' ]; then
            echo 'ERROR: web/ directory not found'
            exit 1
          fi
          echo 'OK: web/ directory found'

      - name: Check index.html exists and is not empty
        run: |
          if [ ! -f 'web/index.html' ]; then
            echo 'ERROR: web/index.html not found'
            exit 1
          fi
          if [ ! -s 'web/index.html' ]; then
            echo 'ERROR: web/index.html is empty'
            exit 1
          fi
          echo 'OK: web/index.html found and is not empty'

      - name: Check style.css exists and is not empty
        run: |
          if [ ! -f 'web/style.css' ]; then
            echo 'ERROR: web/style.css not found'
            exit 1
          fi
          if [ ! -s 'web/style.css' ]; then
            echo 'ERROR: web/style.css is empty'
            exit 1
          fi
          echo 'OK: web/style.css found and is not empty'

      - name: Validation summary
        run: |
          echo '================================================'
          echo 'All validation checks passed. Safe to deploy.'
          echo '================================================'

      # ============================================================
      # JOB 2: Deploy after validation passes
      # ============================================================
  deploy:
    name: Deploy to Nginx
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Configure Nginx
        run: |
          sudo tee /etc/nginx/sites-available/default > /dev/null <<'EOF'
          server {
              listen 80 default_server;
              listen [::]:80 default_server;

              root /var/www/html;
              index index.html;

              server_name _;

              location / {
              try_files $uri $uri/ =404;
              }
          }
          EOF

          sudo nginx -t

      - name: Deploy website files
        run: |
          echo "Deploying website..."

          sudo rm -rf /var/www/html/*
          sudo cp -r web/* /var/www/html/

          sudo chown -R www-data:www-data /var/www/html
          sudo chmod -R 755 /var/www/html

          echo "Deployed files:"
          sudo ls -lah /var/www/html

      - name: Start Nginx
        run: |
          sudo systemctl start nginx
          sudo systemctl enable nginx


      - name: Verify Nginx configuration
        run: |
          sudo nginx -t

      - name: Verify deployed index.html
        run: |
          echo "===== DEPLOYED index.html ====="
          sudo cat /var/www/html/index.html
          echo "==============================="

      - name: Check site responds with HTTP 200
        run: |
          echo "Checking site health..."

          HTTP_STATUS=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost)

          echo "HTTP response code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "HEALTH CHECK PASSED: Site is responding with HTTP 200"
          else
            echo "HEALTH CHECK FAILED: Site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Check page contains Interswitch content
        run: |
          echo "Checking deployed page content..."

          PAGE=$(curl -sS http://localhost)

          echo "===== PAGE RETURNED BY NGINX ====="
          echo "$PAGE"
          echo "==================================="

          if echo "$PAGE" | grep -qi "Interswitch"; then
            echo "CONTENT CHECK PASSED: Page contains expected Interswitch content"
          else
            echo "CONTENT CHECK FAILED: Unexpected page content detected"
            exit 1
          fi

      - name: Health check summary
        run: |
          echo "================================================"
          echo "All health checks passed."
          echo "Site verified at: http://localhost"
          echo "================================================"


     