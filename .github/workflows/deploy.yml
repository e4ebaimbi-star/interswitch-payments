---
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: self-hosted
    steps:

     - name: Checkout repository
       uses: actions/checkout@v4

     - name: Show file structure
       run: |
         echo === Repository structure ===
         Get-ChildItem -Recurse
         echo === Done ===

     - name: Check web directory exists
       run: |
         if (Test-Path -Path "web" -PathType Container) {
           echo "web directory exists" 
         } else { 
           echo "web/ directory NOT found"
           exit 1
         }  

     - name: Check index.html exists and is not empty
       run: |
         if (( Test-Path "web/index.html") -and ((Get-Item "web/index.html").Length -gt 0)) {
            echo "index.html ok"
         }  else { exit 1}

     - name: Check style.css exists and is not empty
       run: |
         if ((Test-Path "web/style.css") -and ((Get-Item "web/style.css").Length -gt 0)) {
            echo "style.css ok"
         }  else { exit 1 }

     - name: Validation summary
       run: |
         echo '================================================'
         echo 'All validation checks passed. Safe to deploy.'
         echo '================================================'


# ================================================
# JOB 2: Deploy via SSH after validation passes
# ================================================
  deploy:
    name: Deploy Via SSH
    runs-on: self-hosted
    needs: validate # Only runs if validate passed

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up SSH key
      shell: cmd
      run: |
        if not exist "%USERPROFILE%\.ssh" mkdir "%USERPROFILE%\.ssh"
        echo ${{ secrets.DEPLOY_KEY }} > "%USERPROFILE\.ssh\id_rsa"
        ssh-keyscan -H ${{ secrets.UBUNTU_HOST }} >> "$%USERPROFILE\.ssh\known_hosts"

    - name: Copy web files to Ubuntu
      shell: cmd
      run: |
        echo "Copying files to Ubuntu..."
        scp -i "$%USERPROFILE\.ssh\id_rsa" -r web/* ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }}:/tmp/interswitch/

    - name: Install files to Nginx web root
      shell: cmd
      run: |
        ssh -i "%USERPROFILE%\.ssh\id_rsa" ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST}} "sudo rm -rf /var/www/html/* && sudo mv /tmp/interswitch/* /var/www/html/ && sudo systemctl reload nginx"

    - name: Verify Nginx is still running
      shell: cmd
      run: |
        ssh -i "%USERPROFILE%\.ssh\id_rsa ${{ secrets.UBUNTU_USER }}@${{ secrets.UBUNTU_HOST }} "sudo systemctl status nginx --no-pager" 

    - name: Write deployment log entry
      shell: cmd
      run: |
        ssh -i "%USERPROFILE%\.ssh\id_rsa ${{ secrets.UBUNTU_USER}}@{{ secrets.UBUNTU_HOST }}
        "echo '[$(date)] Deployed ${{ github.sha }}' \ | sudo tee -a /var/log/interswitch_deployments.log"

    - name: Deployment complete
      shell: cmd
      run: |
        echo "================================================"
        echo "Deployment complete!"
        echo "Successfully deployed to http://%UBUNTU_HOST%"
        echo "================================================"
       
