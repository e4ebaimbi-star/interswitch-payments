
name: Interswitch Portal — CI/CD Pipeline
on:
  push:
    branches:
      - main
jobs:
  # ================================================
  # JOB 1: Validate files before any deployment
  # ================================================
  validate:
    name: Validate Web Files
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show file structure
        run: |
          echo '=== Repository structure ==='
          ls -la
          echo '=== Web directory ==='
          ls -la web/

      - name: Check web directory exists
        run: |
          if [ ! -d 'web' ]; then
            echo 'ERROR: web/ directory not found'
            exit 1
          fi
          echo 'OK: web/ directory found'

      - name: Check index.html exists and is not empty
        run: |
          if [ ! -f 'web/index.html' ]; then
            echo 'ERROR: web/index.html not found'
            exit 1
          fi
          if [ ! -s 'web/index.html' ]; then
            echo 'ERROR: web/index.html is empty'
            exit 1
          fi
          echo 'OK: web/index.html found and is not empty'

      - name: Check style.css exists and is not empty
        run: |
          if [ ! -f 'web/style.css' ]; then
            echo 'ERROR: web/style.css not found'
            exit 1
          fi
          if [ ! -s 'web/style.css' ]; then
            echo 'ERROR: web/style.css is empty'
            exit 1
          fi
          echo 'OK: web/style.css found and is not empty'

      - name: Validation summary
        run: |
          echo '================================================'
          echo 'All validation checks passed. Safe to deploy.'
          echo '================================================'

      # ============================================================
      # JOB 2: Deploy after validation passes
      # ============================================================
  deploy:
    name: Deploy to Nginx
    runs-on: ubuntu-latest
    needs: validate
    if: github.ref == 'refs/heads/main'

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx

      - name: Start Nginx
        run: |
          sudo systemctl start nginx
          sudo systemctl enable nginx

      - name: Copy web files to Nginx
        run: |
          echo "Copying files to Nginx..."

          sudo mkdir -p /usr/share/nginx/html
          sudo cp -r web/* /usr/share/nginx/html/

      - name: Set web file permissions
        run: |
          sudo chown -R www-data:www-data /usr/share/nginx/html/
          sudo chmod -R 755 /usr/share/nginx/html/

      - name: Test Nginx configuration
        run: |
          sudo nginx -t

      - name: Reload Nginx
        run: |
          sudo systemctl reload nginx

      - name: Verify Nginx is still running
        run: |
          sudo systemctl status nginx --no-pager

      - name: Wait for site to be ready
        run: |
          sleep 5

      - name: Check site responds with HTTP 200
        run: |
          echo "Checking site health..."

          HTTP_STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
            http://localhost)

          echo "HTTP response code: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "HEALTH CHECK PASSED: Site is responding with HTTP 200"
          else
            echo "HEALTH CHECK FAILED: Site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Check page contains Interswitch content
        run: |
          PAGE=$(curl -s http://localhost)

          if echo "$PAGE" | grep -q "Interswitch"; then
            echo "CONTENT CHECK PASSED: Page contains expected content"
          else
            echo "CONTENT CHECK FAILED: Unexpected page content detected"
            echo "This may mean the wrong files were deployed"
            exit 1
          fi

      - name: Write deployment log entry
        run: |
          echo "[$(date)] Deployed commit ${{ github.sha }}" \
            | sudo tee -a /var/log/interswitch_deployments.log

      - name: Deployment complete
        run: |
          echo "================================================"
          echo "Deployment complete!"
          echo "Commit: ${{ github.sha }}"
          echo "Nginx: running"
          echo "Health check: PASSED"
          echo "Content check: PASSED"
          echo "Site: http://localhost"
          echo "================================================"